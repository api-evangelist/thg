name: THG
description: >-
  THG plc (formerly The Hut Group) is a UK-based consumer brands group founded
  in 2004 in Manchester and listed on the London Stock Exchange. Following the
  2025 demerger of its Ingenuity technology and fulfilment division, THG is a
  pure-play consumer brands business operating two divisions: THG Beauty (home
  to Lookfantastic, Cult Beauty, Dermstore and prestige brand partners) and THG
  Nutrition (led by Myprotein, one of the world's largest online sports-nutrition
  brands). THG designs, manufactures and sells beauty and nutrition products
  direct-to-consumer across global markets. It was surfaced in the API Evangelist
  network as a portfolio company of Balderton Capital, an early investor. THG
  operates corporate, investor-relations and careers web properties but publishes
  no public developer API, developer portal, or API documentation; this profile
  captures its identity and a live domain-security probe.
